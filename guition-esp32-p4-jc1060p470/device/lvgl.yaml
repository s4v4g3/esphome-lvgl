lvgl:
  displays: my_display
  byte_order: little_endian

  top_layer:
    widgets:
      - label:
          text: "BBQ PIT"
          text_font: clockbar_font
          align: top_left
          x: 12
          y: 8
          text_color: 0xFFFFFF
      - label:
          text: "--:--"
          id: display_time
          text_font: clockbar_font
          align: top_mid
          x: 0
          y: 8
          text_align: center
          text_color: 0xFFFFFF

  pages:
    - id: main_page
      layout:
        type: flex
        flex_flow: column
      width: 100%
      height: 100%
      bg_color: 0x20252B
      bg_opa: cover
      scrollbar_mode: "off"
      widgets:
        - obj:
            id: bbq_panel
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            widgets:
              - label:
                  id: hvac_mode_label
                  text: "off"
                  text_font: label_font
                  text_color: 0xAEB8C2
                  align: top_mid
                  y: 62
              - arc:
                  id: target_temperature_arc
                  x: 272
                  y: 92
                  width: 430px
                  height: 430px
                  min_value: 0
                  max_value: 300
                  value: 110
                  start_angle: 135
                  end_angle: 45
                  arc_width: 18
                  arc_color: 0x3B444D
                  indicator:
                    arc_color: 0xE58A32
                    arc_width: 18
                  knob:
                    bg_color: 0xFFFFFF
                  on_value:
                    - homeassistant.service:
                        service: climate.set_temperature
                        data:
                          entity_id: climate.bbq_esphome_esphome_bbq_pit_controller
                          hvac_mode: heat
                          temperature: !lambda return x;
              - arc:
                  id: pit_temperature_arc
                  x: 272
                  y: 92
                  width: 430px
                  height: 430px
                  min_value: 0
                  max_value: 300
                  value: 0
                  start_angle: 135
                  end_angle: 45
                  arc_width: 0
                  arc_color: 0x000000
                  indicator:
                    arc_color: 0x8CA0AE
                    arc_width: 5
                  knob:
                    bg_color: 0x8CA0AE
                  clickable: false
              - label:
                  id: target_temperature_label
                  text: "--.-°"
                  text_font: statistics_font
                  text_color: 0xFFFFFF
                  align: center
                  y: 6
              - label:
                  id: pit_temperature_label
                  text: "--.-°"
                  text_font: label_font
                  text_color: 0x64D6C5
                  align: center
                  y: 72
              - label:
                  text: "PIT"
                  text_font: clockbar_font
                  text_color: 0x8CA0AE
                  x: 95
                  y: 185
              - label:
                  id: fan_output_label
                  text: "--%"
                  text_font: statistics_font
                  text_color: 0x64D6C5
                  x: 790
                  y: 220
              - label:
                  text: "FAN"
                  text_font: clockbar_font
                  text_color: 0x8CA0AE
                  x: 802
                  y: 285
              - button:
                  id: off_mode_button
                  x: 340
                  y: 530
                  width: 150px
                  height: 55px
                  styles: control
                  widgets:
                    - label:
                        text_font: $icon_font
                        text: $power
                        align: center
                  on_click:
                    - homeassistant.service:
                        service: climate.set_hvac_mode
                        data:
                          entity_id: climate.bbq_esphome_esphome_bbq_pit_controller
                          hvac_mode: 'off'
              - button:
                  id: heat_mode_button
                  x: 534
                  y: 530
                  width: 150px
                  height: 55px
                  checkable: true
                  styles: control
                  widgets:
                    - label:
                        text_font: $icon_font
                        text: $fire
                        align: center
                  on_click:
                    - homeassistant.service:
                        service: climate.set_hvac_mode
                        data:
                          entity_id: climate.bbq_esphome_esphome_bbq_pit_controller
                          hvac_mode: heat
